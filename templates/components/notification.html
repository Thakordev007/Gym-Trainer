<div class="notif-dropdown" id="notifDropdown" hidden>
  <div class="notif-dropdown__head">
    <strong>Notifications</strong>
    <button class="btn btn-ghost btn-sm" id="markAllReadBtn">Mark all read</button>
  </div>
  <ul class="notif-list">
    <li class="notif-item unread">
      <i class="bi bi-lightning-charge-fill notif-icon lime"></i>
      <div><p>Your workout is ready 💪</p><span class="muted">2 min ago</span></div>
    </li>
    <li class="notif-item unread">
      <i class="bi bi-fire notif-icon amber"></i>
      <div><p>You completed your 7-day streak 🔥</p><span class="muted">3 hrs ago</span></div>
    </li>
    <li class="notif-item">
      <i class="bi bi-bell-fill notif-icon violet"></i>
      <div><p>Don't forget today's workout.</p><span class="muted">Yesterday</span></div>
    </li>
    <li class="notif-item">
      <i class="bi bi-graph-up notif-icon green"></i>
      <div><p>Your weekly progress has been updated.</p><span class="muted">2 days ago</span></div>
    </li>
  </ul>
</div>
